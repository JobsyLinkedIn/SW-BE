services:
  mongo:
    image: mongo:8.0.8
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  backend:
    build: .
    container_name: backend
    ports:
      - "3000:3000"
    env_file:  # Load environment variables from .env
      - .env
    depends_on:
      - mongo
    networks:
      - app-network

  mongo-express:  # Mongo Express Web UI for MongoDB
    image: mongo-express
    container_name: mongo-express
    ports:
      - "8081:8081"  # Exposes Mongo Express Web UI on port 8081
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo  # Connects to the Mongo container
    depends_on:
      - mongo
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
